

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,2560x1600@240,auto,1.666


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
# $menu = wofi --show drun --conf ~/.config/wofi/config/config --style ~/.config/wofi/src/mocha/style.css
$menu = rofi -show drun 


### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

#exec-once = /usr/share/hyprpanel/hyprpanel.js
#exec-once = hyprpanel
exec-once = clipse -listen
exec-once = dunst
exec-once = awww-daemon
#exec-once = swww img ~/Pictures/wallpapers/everforest.png 
#exec-once = swww restore
exec-once=fcitx5 -d -r
exec-once=fcitx5-remote -r
#exec-once= hyprctl keyword "device[asuf1416:00-2808:0108-touchpad]:enabled" false
exec-once=hyprctl dispatch workspace 5
############################
### User stuff #############
############################


#############################
### ENVIRONMENT VARIABLES ###
#############################

# Xwayland
xwayland {
    force_zero_scaling = true
  }
env = GDK_SCALE, 2
env = ANKI_WAYLAND, 1
env = QT_QPA_PLATFORMTHEME, qt6ct
# env = GTK_THEME=, qt6ct

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = HYPRCURSOR_SIZE,24
env = XCURSOR_SIZE,24
env = SUDO_EDITOR,/usr/bin/nvim
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = HISTSIZE,30000
env = HISTFILESIZE,30000

### GPU

#####################
### LOOK AND FEEL ###
#####################

#Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 2

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(a7c080ee) 
    col.inactive_border = rgba(3c4841ee)
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}
# Fix intellij focus flickering from: https://github.com/hyprwm/Hyprland/issues/4396
#windowrulev2 = windowdance, class:^(.*jetbrains.*)$
# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[t1], gapsout:0, gapsin:0
# workspace = w[tg1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[t1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[t1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tg1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tg1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
#
#
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}


# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    vfr = true
}

group {
  col.border_active = rgba(e69875ee) 
  col.border_inactive = rgba(dbbc7faa)
}
group:groupbar {
  enabled = false
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us 
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    repeat_delay = 230
    repeat_rate = 100 
    touchpad {
      natural_scroll = false
      disable_while_typing = true
    }

}

# https://wiki.hyprland.org/Configuring/Variables/#gestures

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more

device { # doesn't work
  name=asuf1416:00-2808:0108-touchpad
  enabled=false 
}


###################
### BINDINGS ######
###################
#
# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, P, exec, $terminal
bind = $mainMod, O, killactive,
bind = $mainMod, Y, exit,
bind = $mainMod, D, exec, $fileManager
bind = $mainMod, J, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, Comma, togglesplit, # dwindle
bind = $mainMod SHIFT, F, fullscreen
bind = , f10, exec, bash -c 'hyprctl keyword "device[asuf1416:00-2808:0108-touchpad]:enabled" true'
bind = SHIFT, f10,exec, bash -c 'hyprctl keyword "device[asuf1416:00-2808:0108-touchpad]:enabled" false'

# Move focus with mainMod + vim direction keys
bind = $mainMod, K, movefocus, l
bind = $mainMod, E, movefocus, r
bind = $mainMod, A, movefocus, u
bind = $mainMod, H, movefocus, d

# Move windows
bind = $mainMod ALT, K, movewindow, l
bind = $mainMod ALT, E, movewindow, r
bind = $mainMod ALT, A, movewindow, u
bind = $mainMod ALT, H, movewindow, d

# Switch workspaces with mainMod + [0-9]
# bind = $mainMod, 1, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 1'
# bind = $mainMod, 2, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 2'
bind = $mainMod, 3, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 3'
bind = $mainMod, 4, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 4'
bind = $mainMod, 5, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 5'
bind = $mainMod, 6, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 6'
bind = $mainMod, 7, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 7'
bind = $mainMod, 8, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 8'
bind = $mainMod, 9, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 9'
bind = $mainMod, 0, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade && hyprctl dispatch workspace 5'

# Window groups
bind = $mainMod, f, togglegroup
bind = $mainMod, i, changegroupactive, f
binde = $mainMod ALT, left, movewindoworgroup, left
binde = $mainMod ALT, right, movewindoworgroup, right
binde = $mainMod ALT, down, movewindoworgroup, down
binde = $mainMod ALT, up, movewindoworgroup, up
# Scrolling workspace 
workspace = 5, default:true, persistent:true, layout:scrolling
workspace = 2, default:true, persistent:true, layout:scrolling
workspace = 3, default:true, persistent:true, layout:scrolling
workspace = 8, default:true, persistent:true, layout:scrolling
workspace = 9, default:true, persistent:true, layout:scrolling
binde = $mainMod, left, layoutmsg, colresize -0.035
binde = $mainMod, right, layoutmsg, colresize +0.035
binde = $mainMod, down, layoutmsg, colresize 0.5
binde = $mainMod, up, layoutmsg, colresize 1.0
bind = $mainMod, period, layoutmsg, promote


### Torus workspaces ###

# Move to workspaces by direction
bind = $mainMod SHIFT, e, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slide && x=$(hyprctl activeworkspace -j| jq ".id");hyprctl dispatch workspace $(( (($x-1)%3+1)%3+(($x-1)/3)*3 +1))'
bind = $mainMod SHIFT, k, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slide && x=$(hyprctl activeworkspace -j| jq ".id");hyprctl dispatch workspace $(( (($x-1)%3+2)%3+(($x-1)/3)*3 +1))'
bind = $mainMod SHIFT, h, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slidevert && hyprctl dispatch workspace $(((($(hyprctl activeworkspace -j| jq '.id')+2)%9)+1))'
bind = $mainMod SHIFT, a, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slidevert && hyprctl dispatch workspace $(((($(hyprctl activeworkspace -j| jq '.id')+5)%9)+1))'

# Move active window to workspace silently to different directions 
bind = $mainMod CONTROL, e, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slide && x=$(hyprctl activeworkspace -j| jq ".id");hyprctl dispatch movetoworkspacesilent $(( (($x-1)%3+1)%3+(($x-1)/3)*3 +1))'
bind = $mainMod CONTROL, k, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slide && x=$(hyprctl activeworkspace -j| jq ".id");hyprctl dispatch movetoworkspacesilent $(( (($x-1)%3+2)%3+(($x-1)/3)*3 +1))'
bind = $mainMod CONTROL, h, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slidevert && hyprctl dispatch movetoworkspacesilent $(((($(hyprctl activeworkspace -j| jq '.id')+2)%9)+1))'
bind = $mainMod CONTROL, a, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slidevert && hyprctl dispatch movetoworkspacesilent $(((($(hyprctl activeworkspace -j| jq '.id')+5)%9)+1))'

# Move active window to workspace to different direction non silently
bind = $mainMod_CONTROL_SHIFT, e, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slide && x=$(hyprctl activeworkspace -j| jq ".id");hyprctl dispatch movetoworkspace $(( (($x-1)%3+1)%3+(($x-1)/3)*3 +1))'
bind = $mainMod_CONTROL_SHIFT, k, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slide && x=$(hyprctl activeworkspace -j| jq ".id");hyprctl dispatch movetoworkspace $(( (($x-1)%3+2)%3+(($x-1)/3)*3 +1))'
bind = $mainMod_CONTROL_SHIFT, h, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slidevert && hyprctl dispatch movetoworkspace $(((($(hyprctl activeworkspace -j| jq '.id')+2)%9)+1))'
bind = $mainMod_CONTROL_SHIFT, a, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,slidevert && hyprctl dispatch movetoworkspace $(((($(hyprctl activeworkspace -j| jq '.id')+5)%9)+1))'



# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 5

# Example special workspace (scratchpad)
bind = $mainMod, r, togglespecialworkspace, magic
bind = $mainMod CONTROL, r, movetoworkspace, special:magic
bind = $mainMod_SHIFT, r, exec, bash -c 'hyprctl keyword animation workspaces, 1,6,default,fade&& x=$(hyprctl activeworkspace -j| jq ".id");hyprctl dispatch movetoworkspace $x'

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, previous
bind = $mainMod, mouse_up, workspace, previous

# Alternative keybinds for brightness and volume for external keyboard
bindel = $mainMod, f11, exec, ~/scripts/changeVolume.sh 5%-
bindel = $mainMod, bracketright, exec, ~/scripts/changeVolume.sh 5%+
bindel = $mainMod SHIFT, f11, exec, ~/scripts/changeVolume.sh toggle
bindel = $mainMod, equal, exec, ~/scripts/changeBrightness.sh 3%+
bindel = $mainMod, semicolon, exec,~/scripts/changeBrightness.sh 3%-


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
# Resize windows with keybinds
# Resize window width and height using arrow keys

# will switch to a submap called resize
bind = $mainMod, u, submap, resize

# will start a submap called "resize"
submap = resize

# sets repeatable binds for resizing the active window
binde = , e, resizeactive, 20 0
binde = , k, resizeactive, -20 0
binde = , a, resizeactive, 0 -20 
binde = , h, resizeactive, 0 20 


# use reset to go back to the global submap
bind = , escape, submap, reset 

# will reset the submap, which will return to the global submap
submap = reset

# keybinds further down will be global again...
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 3%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 3%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = $mainMod SHIFT, PRINT, exec, hyprshot -m region
# Screenshot region copy but don't save
bind =SHIFT ,PRINT, exec, hyprshot -m region --clipboard-only

# Sleep
bind = $mainMod, BackSpace, exec, systemctl suspend

#Clipboard manager
bind = $mainMod SHIFT, p, exec,  kitty --class clipse -e clipse
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

windowrule = float on, size 622 652, stay_focused on, match:class ^(clipse)$

windowrule {
  name = "float-copyq"
  match:class = com.github.hluk.copyq
  float = true
  size = 700 700
}
windowrule {
  name = "float-copyq-xwayland"
  match:class = copyq
  float = true
  size = 700 700
}

windowrule = match:class clipse, float true # ensure you have a floating window class set if you want this behavior
windowrule = match:class clipse, size 622 652 # set the size of the window as necessary
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

